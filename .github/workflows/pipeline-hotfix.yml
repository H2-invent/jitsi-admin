name: Create Hotfix Build

permissions:
  contents: read
  packages: write

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master
      - main

jobs:
  version:
    uses: ./.github/workflows/task-version.yml

  artifact:
    uses: ./.github/workflows/task-artifact.yml
    needs:
      - version

  test:
    uses: ./.github/workflows/task-test.yml
    needs:
      - version
      - artifact

  harbor_core:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      registry: reg.h2-invent.com
      dockerfile_path: './Dockerfile'
      directory: '.'
      version: ${{ needs.version.outputs.version }}
      tags: reg.h2-invent.com/meetling/core:${{ needs.version.outputs.version }}
    secrets:
      dockerhub_password: ${{ secrets.HARBOR_PUSH_PASSWORD }}
      dockerhub_username: ${{ secrets.HARBOR_PUSH_USERNAME }}

  harbor_websocket:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      registry: reg.h2-invent.com
      dockerfile_path: './nodejs/Dockerfile'
      directory: './nodejs'
      version: ${{ needs.version.outputs.version }}
      tags: reg.h2-invent.com/meetling/websocket:${{ needs.version.outputs.version }}
    secrets:
      dockerhub_password: ${{ secrets.HARBOR_PUSH_PASSWORD }}
      dockerhub_username: ${{ secrets.HARBOR_PUSH_USERNAME }}
