name: Create Release

permissions:
  contents: write
  packages: write

on:
  pull_request:
    types: [closed]
    branches:
      - master
      - main

jobs:
  version:
    uses: ./.github/workflows/task-version.yml

  artifact:
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/task-artifact.yml
    needs:
      - version

  test:
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/task-test.yml
    needs:
      - version
      - artifact

###########################################
# Docker H2 invent Registry Jobs
###########################################

  docker_prod_core:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      registry: reg.h2-invent.com
      dockerfile_path: './Dockerfile-prod'
      directory: '.'
      version: ${{ needs.version.outputs.version }}
      tags: reg.h2-invent.com/meetling/core:${{ needs.version.outputs.version }},reg.h2-invent.com/meetling/core:latest
    secrets:
      dockerhub_password: ${{ secrets.HARBOR_PUSH_PASSWORD }}
      dockerhub_username: ${{ secrets.HARBOR_PUSH_USERNAME }}

  docker_prod_websocket:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
    uses: ./.github/workflows/task-release.yml
    with:
      registry: reg.h2-invent.com
      dockerfile_path: './nodejs/Dockerfile-prod'
      directory: './nodejs'
      version: ${{ needs.version.outputs.version }}
      tags: reg.h2-invent.com/meetling/websocket:${{ needs.version.outputs.version }},reg.h2-invent.com/meetling/websocket:latest
    secrets:
      dockerhub_password: ${{ secrets.HARBOR_PUSH_PASSWORD }}
      dockerhub_username: ${{ secrets.HARBOR_PUSH_USERNAME }}

  docker_prod_application:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
      - docker_prod_core
      - docker_prod_websocket
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      registry: reg.h2-invent.com
      dockerfile_path: './Dockerfile-aio'
      directory: '.'
      version: ${{ needs.version.outputs.version }}
      tags: reg.h2-invent.com/meetling/application:${{ needs.version.outputs.version }},reg.h2-invent.com/meetling/application:latest
    secrets:
      dockerhub_password: ${{ secrets.HARBOR_PUSH_PASSWORD }}
      dockerhub_username: ${{ secrets.HARBOR_PUSH_USERNAME }}

###########################################
# Docker Dockerhub Jobs
###########################################

  upload_dockerhub_main:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      dockerfile_path: './Dockerfile'
      directory: '.'
      version: ${{ needs.version.outputs.version }}
      tags: h2invent/jitsi-admin-main:latest,h2invent/jitsi-admin-main:${{ needs.version.outputs.version }}
    secrets:
      dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

  upload_dockerhub_websocket:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      dockerfile_path: './nodejs/Dockerfile'
      directory: './nodejs'
      version: ${{ needs.version.outputs.version }}
      tags: h2invent/jitsi-admin-websocket:latest,h2invent/jitsi-admin-websocket:${{ needs.version.outputs.version }}
    secrets:
      dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

###########################################
# Release
###########################################

  release:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: false

  release_note:
    if: needs.version.outputs.skip != 'true'
    needs:
      - version
      - test
      - docker_prod_core
      - docker_prod_websocket
    uses: ./.github/workflows/task-upload-docker-hub.yml
    with:
      version: ${{ needs.version.outputs.version }}
