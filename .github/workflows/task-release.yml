name: Publish new Release

on:
  workflow_call:
    inputs:
      version:
        description: 'release version'
        default: true
        type: string
      prerelease:
        description: 'publish releases as preprelease'
        default: true
        type: boolean
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: artifact_${{github.run_number}}

      - run: unzip -qq artifact_${{github.run_number}}.zip -d artifact

      - name: Set laF_version in .env
        run: |
          sed -i 's/^laF_version=.*/laF_version=${{ inputs.version }}/' artifact/.env

      - name: Archive Release for application
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: 'application.zip'
          exclusions: '*.git* *.github* /*node_modules/* /*nodejs/* /*var/* .editorconfig'
          directory: artifact

      - name: Archive Release for websocket
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: 'websocket.zip'
          directory: artifact/nodejs

      - name: Resolve last stable release
        id: last_stable_release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('tag', release.tag_name);
            } catch (error) {
              if (error.status === 404) {
                core.info('No previous stable release found; falling back to auto-resolution.');
                core.setOutput('tag', '');
              } else {
                throw error;
              }
            }

      - name: Build changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog-configuration.json
          fromTag: ${{ steps.last_stable_release.outputs.tag }}
          toTag: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute major.minor version
        id: version_heading
        run: |
          echo "major_minor=$(echo '${{ inputs.version }}' | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Create new Release with semantic-version tag
        uses: ncipollo/release-action@v1
        id: create_release
        with:
          draft: false
          prerelease: ${{ inputs.prerelease }}
          name: Release ${{ inputs.version }}
          tag: ${{ inputs.version }}
          artifacts: artifact/application.zip,artifact/nodejs/websocket.zip
          artifactContentType: application/zip
          body: |
            # Features, Improvements, and Bug Fixes in Jitsi Admin

            ## ${{ steps.version_heading.outputs.major_minor }}

            ${{ steps.build_changelog.outputs.changelog }}
