vich_uploader:
    db_driver: orm
    storage: gaufrette
    metadata:
        type: attribute
    mappings:
        profile:
            inject_on_load: true
            #uri_prefix: "%env(AWS_BASE_URL)%/%env(AWS_BUCKET_NAME)%/profile"
            uri_prefix: "%env(VICH_BASE)%/uploads/images"
            upload_destination: document_fs
            delete_on_update: true
            delete_on_remove: true
            namer: vich_uploader.namer_uniqid
